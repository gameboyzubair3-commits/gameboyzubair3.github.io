
<!DOCTYPE html>
<html lang="bn">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ওয়েবসাইট</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: #333;
        }
        header {
            background: #4CAF50;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
        }
        nav {
            background: #333;
            color: #fff;
            padding: 0.5rem 0;
            text-align: center;
        }
        nav a {
            color: #fff;
            margin: 0 1rem;
            text-decoration: none;
        }
        .container {
            padding: 2rem;
            max-width: 800px;
            margin: auto;
        }
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }

<body>
    <header>
        <h1>স্বাগতম</h1>
    </header>
    <nav>
        <a href="#">হোম</a>

        <a href="#">যোগাযোগ</a>

    <div class="container">
        <h2>আমাদের সেবাগুলো দেখুন</h2>
        <p>এখানে আপনি বিভিন্ন অ্যাপ এবং গেমের সাবস্ক্রিপশন পাবেন।</p>
    </div>
    <footer>
        <p>&copy; ২০২৬ আমার ওয়েবসাইট</p>
    </footer>
